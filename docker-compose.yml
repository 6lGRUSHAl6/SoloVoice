version: "3.8"

services:
  # ============================================================================
  # SoloVoice Discord Bot Service
  # ============================================================================
  discord-bot:
    # Сборка образа из Dockerfile в текущей директории
    build: .
    
    # Имя контейнера
    container_name: solovoice_bot
    
    # Перезагрузить контейнер при выходе (кроме ручной остановки)
    restart: unless-stopped
    
    # Загрузить переменные окружения из файла .env
    env_file:
      - .env
    
    # Переменные окружения
    environment:
      # Отключить буферизацию вывода Python для логирования в реальном времени
      - PYTHONUNBUFFERED=1
    
    # Логирование (опционально)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
